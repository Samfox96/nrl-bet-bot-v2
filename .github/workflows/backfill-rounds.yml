name: Backfill rounds

# Catch-up for finished rounds, with no AI and no Claude allowance: it loops the same per-round pipeline that
# weekly-update.yml runs once a week (scripts/backfill_rounds.py: scrape player stats, validate, merge, scrape
# match results, validate, merge, score). Run it by hand from the Actions tab:
#   Run workflow -> start round, end round (and the branch, if the script isn't on main yet).
#
# It saves to a branch, never to main: pick the Engineer's backfill branch (agent/...) or a new branch name.
# Rounds are saved one run at a time even if a later round fails, so a failure never loses finished rounds.

on:
  workflow_dispatch:
    inputs:
      start_round:
        description: First round to backfill
        required: true
      end_round:
        description: Last round to backfill (same as the first for one round)
        required: true
      season:
        description: Season
        required: true
        default: '2026'
      branch:
        description: Branch to run on and save to (leave empty to use the branch picked in "Use workflow from"). Never main.
        required: false

permissions:
  contents: write

concurrency:
  group: nrl-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      START_ROUND: ${{ inputs.start_round }}
      END_ROUND: ${{ inputs.end_round }}
      SEASON: ${{ inputs.season }}
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check the inputs
        run: |
          for v in "$START_ROUND" "$END_ROUND" "$SEASON"; do
            printf '%s' "$v" | grep -Eq '^[0-9]+$' || { echo "::error::Rounds and season must be whole numbers (got '$v')."; exit 1; }
          done
          if [ "$START_ROUND" -gt "$END_ROUND" ]; then echo "::error::The start round is after the end round."; exit 1; fi
          printf '%s' "$TARGET_BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$' || { echo "::error::That branch name isn't valid."; exit 1; }
          if [ "$TARGET_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::This saves data, so it won't write straight to $DEFAULT_BRANCH. Pick the Engineer's backfill branch, or type a new branch name."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy selenium webdriver-manager beautifulsoup4 requests

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Backfill the rounds
        id: backfill
        run: |
          test -f scripts/backfill_rounds.py || { echo "::error::scripts/backfill_rounds.py isn't on branch $TARGET_BRANCH. Run this on the Engineer's backfill branch."; exit 1; }
          python scripts/backfill_rounds.py --start-round "$START_ROUND" --end-round "$END_ROUND" --season "$SEASON"

      # Runs even if a round failed, so the rounds that did finish are kept.
      - name: Save what was backfilled to the branch
        if: always() && steps.backfill.outcome != 'skipped'
        run: |
          git config user.name "nrl-backfill"
          git config user.email "nrl-backfill@users.noreply.github.com"
          git add -A data STATUS.md
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -q -m "Backfill rounds ${START_ROUND}-${END_ROUND} (season ${SEASON}), no AI"
            git push -q origin "HEAD:refs/heads/${TARGET_BRANCH}"
            echo "Saved to ${TARGET_BRANCH}."
          fi
          {
            echo "### Backfill rounds ${START_ROUND}-${END_ROUND}, season ${SEASON}"
            echo "Result: ${{ steps.backfill.outcome }}. Branch: \`${TARGET_BRANCH}\`."
            echo "Rows in nrl_master.csv: $(($(wc -l < data/nrl_master.csv) - 1))"
          } >> "$GITHUB_STEP_SUMMARY"
